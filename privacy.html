<!doctype html><meta charset="utf-8"><title>プライバシーポリシー - jinro-stream</title>
<h1>プライバシーポリシー</h1>
<p>jinro-stream は、運営者本人のYouTubeチャンネルの配信枠を操作するためだけに使う個人用ツールです。</p>
<ul>
<li>Googleアカウントの許可情報は、運営者のPC内にだけ保存し、外部に送信・共有しません。</li>
<li>YouTube Data APIで扱うのは、運営者本人のチャンネルの配信枠の情報（題名・説明・公開範囲・サムネイル）だけです。</li>
<li>他の人のデータは収集しません。</li>
<li>許可は Google アカウントの設定（myaccount.google.com/permissions）からいつでも取り消せます。</li>
</ul>
